<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Tool</title>

  <!-- Bootstrap + Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      transition: background-color 0.3s, color 0.3s;
    }
    .dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
    }
    .password-generator, .password-checker {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .dark-mode .password-generator, .dark-mode .password-checker {
      background-color: #1e1e1e;
      color: #e0e0e0;
    }
    .dark-mode input, .dark-mode textarea {
      background-color: #2c2c2c;
      color: #e0e0e0;
      border: 1px solid #444;
    }
    .dark-mode button {
      background-color: #333;
      color: #e0e0e0;
    }
    .dark-mode button:hover {
      background-color: #555;
    }
    .history {
      max-height: 150px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .toggle-switch {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .toggle-switch input {
      margin-right: 10px;
    }
    footer {
      margin-top: 40px;
      background-color: #343a40;
      color: white;
      text-align: center;
      padding: 15px 0;
    }
    footer a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Dark Mode Toggle -->
    <div class="toggle-switch">
      <input type="checkbox" id="darkModeToggle">
      <label for="darkModeToggle">Dark Mode</label>
    </div>

    <!-- Password Generator -->
    <div class="password-generator">
      <h2>Generate a Password</h2>
      <input type="text" id="generatedPassword" class="form-control" placeholder="Your generated password" readonly>

<div class="d-flex flex-wrap gap-2 mt-2">
  <button class="btn btn-primary" onclick="generatePassword()">Generate Password</button>
  <button class="btn btn-success" onclick="copyToClipboard()">Copy</button>
  <button class="btn btn-secondary" onclick="exportPassword()">Export Password</button>
  <button class="btn btn-danger" onclick="resetHistory()">Reset History</button>

</div>
<div class="history mt-3">
        <h5>History</h5>
        <ul id="passwordHistory" class="list-group"></ul>
      </div>
    </div>

    <!-- Password Checker -->
    <div class="password-checker">
      <h2>Test Your Password</h2>
      <input type="text" id="testPassword" class="form-control" placeholder="Enter a password">
      <p id="strengthText" class="mt-2"></p>
      <p id="crackTime"></p>
      <div id="suggestionsList"></div>
    </div>

  </div>

  <!-- Footer -->
  <footer>
    <div class="container text-center">
      <p>&copy; Aditya Rauniyar</p>
      <p>
        <a href="https://www.facebook.com/adee.tya.39/" class="me-3"><i class="fab fa-facebook"></i> Facebook</a>
        <a href="https://www.instagram.com/_adityar.7/" class="me-3"><i class="fab fa-instagram"></i> Instagram</a>
        <a href="https://github.com/bratAR"><i class="fab fa-github"></i> GitHub</a>
      </p>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    // Dark Mode
    const darkModeToggle = document.getElementById('darkModeToggle');
    const body = document.body;

    if (localStorage.getItem('darkMode') === 'enabled') {
      body.classList.add('dark-mode');
      darkModeToggle.checked = true;
    }

    darkModeToggle.addEventListener('change', () => {
      if (darkModeToggle.checked) {
        body.classList.add('dark-mode');
        localStorage.setItem('darkMode', 'enabled');
      } else {
        body.classList.remove('dark-mode');
        localStorage.setItem('darkMode', 'disabled');
      }
    });

    // Generator
    const generatedPasswordInput = document.getElementById('generatedPassword');
    const passwordHistoryList = document.getElementById('passwordHistory');

    function generatePassword() {
      const length = 12;
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+[]{}|;:,.<>?';
      let password = '';
      for (let i = 0; i < length; i++) {
        const rand = Math.floor(Math.random() * chars.length);
        password += chars[rand];
      }
      generatedPasswordInput.value = password;
      addToHistory(password);
    }

    function resetHistory() {
  const confirmReset = confirm("Are you sure you want to clear the password history?");
  if (confirmReset) {
    const historyList = document.getElementById('passwordHistory');
    historyList.innerHTML = '';
  }
}


    function copyToClipboard() {
  const passwordField = document.getElementById('generatedPassword');
  if (!passwordField.value) {
    alert('No password to copy!');
    return;
  }
  navigator.clipboard.writeText(passwordField.value).then(() => {
    alert('Password copied to clipboard!');
  }).catch(err => {
    alert('Failed to copy password');
    console.error(err);
  });
}


    function addToHistory(password) {
      const li = document.createElement('li');
      li.textContent = password;
      li.className = 'list-group-item';
      passwordHistoryList.prepend(li);
    }

    function exportPassword() {
      const password = generatedPasswordInput.value;
      if (!password) return alert("No password to export.");
      const blob = new Blob([password], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "password.txt";
      a.click();
      URL.revokeObjectURL(url);
    }

    // Strength Checker
    const testPasswordInput = document.getElementById('testPassword');
    const strengthText = document.getElementById('strengthText');
    const crackTime = document.getElementById('crackTime');
    const suggestionsList = document.getElementById('suggestionsList');

    testPasswordInput.addEventListener('input', () => {
      const password = testPasswordInput.value;
      if (!password) {
        strengthText.textContent = '';
        crackTime.textContent = '';
        suggestionsList.innerHTML = '';
        return;
      }
      const result = zxcvbn(password);
      const score = result.score;
      const feedback = result.feedback;

      const colors = ['#dc3545', '#fd7e14', '#ffc107', '#28a745', '#198754'];
      const messages = ['Very Weak 😟', 'Weak 😕', 'Okay 😐', 'Strong 💪', 'Very Strong 🚀'];

      strengthText.textContent = `Strength: ${messages[score]}`;
      strengthText.style.color = colors[score];
      crackTime.textContent = `Estimated time to crack: ⏱ ${result.crack_times_display.offline_fast_hashing_1e10_per_second}`;

      suggestionsList.innerHTML = feedback.suggestions.length
        ? `<ul>${feedback.suggestions.map(s => `<li>${s}</li>`).join('')}</ul>`
        : '<em>No suggestions – this looks good!</em>';
    });
  </script>
</body>
</html>
